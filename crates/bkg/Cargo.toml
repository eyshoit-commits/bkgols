[package]
name = "bkg"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "BKG sandbox runtime and control plane"
authors = ["BKG Engineering"]

[dependencies]
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
parking_lot = "0.12"
once_cell = "1"
libloading = "0.8"
thiserror = "1"
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
config = "0.14"
notify = "6"
axum = "0.7"
tokio-stream = "0.1"
bytes = "1"
http = "1"
serde_with = "3"
url = "2"
futures = "0.3"

[dependencies.bkg-plugin-api]
path = "../plugin-api"
features = []
